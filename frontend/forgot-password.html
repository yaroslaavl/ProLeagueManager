<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">

<div class="container">
  <div class="nav-links">
    <a href="#" class="link active">Logowanie</a>
    <p>|</p>
    <a href="register.html" class="link">Rejestracja</a>
  </div>
  <div style="text-align: center;display:block;margin: 10px">
    <p style="font-weight: bold ;font-size: 20px">Nie pamiętasz hasła?<p>
    <p style="font-size: 12px">Wprowadź swój adres e-mail poniżej, a w ciągu kilku minut otrzymasz wiadomość e-mail z instrukcjami, jak zresetować hasło. Możesz również ustawić nowe hasło, jeśli nigdy wcześniej go nie ustawiałeś.</p>
  </div>
  <div>
    <p style="font-weight: bold;display: flex">Wprowadź adres e-mail</p>

  <form action="#">

    <button type="submit">Wyślij</button>
  </form>
  <div class="text-center"style="display: block;text-align: center;margin: 25px">
    <a style="text-decoration: none;font-weight: bold;color: #555555" href="login.html" class="secondary-button">← Powrót</a>
