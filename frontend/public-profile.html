<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/publicProfile.css">
  <link rel="stylesheet" href="css/burgerMenu.css"></link>
  <script src="js/publicProfile.js" defer></script>
  <script src="js/burgerMenu.js" defer></script>
  <title>Public Profile</title>
</head>
<body>
<div class="container">
  <header class="header">
    <div class="header-center">
      <a href="main.html"><img src="img/blogo_text.svg" alt="Logo" class="logo"></a>
      <nav class="nav">
        <a href="main.html" class="nav-link-header">Sporty</a>
        <a href="main.html" class="nav-link-header">e-Sporty</a>
      </nav>
      <div class="search-container">
        <img src="img/search.svg" alt="Szukaj" class="search-icon">
        <input type="text" placeholder="Szukaj" class="search-input">
      </div>
      <button style="background: none;" class="icon-btn notification-btn">
        <img src="img/notification-bell.svg" alt="Powiadomienia">
      </button>
      <div class="header-right">
        <div class="menu-container">
          <button class="icon-btn menu-btn" onclick="toggleMenu()">
            <img src="img/menu-hamburger.svg" alt="Menu">
          </button>
          <div class="menu-popup" id="menuPopup">
            <a href="profile-settings.html">
              <img src="img/profile.svg" alt="Profil"> Profil
            </a>
            <a href="private-settings.html">
              <img src="img/lock-circle.svg" alt="Bezpieczeństwo"> Bezpieczeństwo
            </a>
            <a href="alerts-settings.html">
              <img src="img/notification-bell.svg" alt="Powiadomienia"> Powiadomienia
            </a>
            <a href="manage-settings.html">
              <img src="img/key.svg" alt="Uprawnienia"> Uprawnienia
            </a>
            <a href="#" id="log-out">
              <img src="img/logout.png" alt="Log Out"> Log Out
            </a>
          </div>
        </div>
        <button class="icon-btn profile-btn">
          <a href="public-profile.html"><img src="img/profile.svg" alt="Profil"></a>
        </button>
      </div>
    </div>
  </header>

  <main class="profile-container">
    <section class="profile-header">
      <div class="profile-avatar">
        <img src="img/profile.svg" alt="Avatar" id="profile_img">
      </div>
      <div class="profile-info">
        <h1 id ="first_last_name">Imię Nazwisko</h1>
        <p class="nickname" id="nickname">Nickname</p>
        <div style="display: flex;gap:20px">
        <div class="profile-details">
          <span style="color: #808A9D">Data urodzenia: </span>
          <span id="date_of_birth" style="color: #000000;font-weight: bold">02.12.2004 (20 lat)</span>
        </div>
        <div class="profile-details">
          <span style="color: #808A9D">Profil utworzony: </span>
          <span id="creation-date" style="color: #000000;font-weight: bold">06.01.2025</span>
          </div></div>
      </div>
      <div style="display: flex;margin-bottom: -70px">
        <nav class="profile-tabs">
          <button class="tab active">Drużyny</button>
          <button class="tab">Mecze</button>
          <button class="tab">Ligi</button>
          <button class="tab">Turnieje</button>
        </nav>
      </div>
      <div class="profile-settings">
        <button class="settings-btn">
          <a href="profile-settings.html"><img src="img/free-icon-gear-484613.png" alt="Settings"></a>
        </button>
      </div>

    </section>


      <div class="content-placeholder"></div>

  </main>

  <footer>
    <div class="footer-content">
      <span>Wspierane przez <a href="https://zut.edu.pl" target="_blank">ZUT</a></span>
      <span>Wersja: <a href="#">1.22.1</a></span>
      <span>Strona: 2ms</span>
      <span>Szablon: 0ms</span>
    </div>
    <div class="footer-links">
      <a href="#">Licencje</a>
      <a href="#">API</a>
    </div>
  </footer>
</div>

</body>
</html>
