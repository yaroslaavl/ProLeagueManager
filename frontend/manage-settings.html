<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/manage.css">
  <script src="js/manage.js" defer></script> <!-- Подключение скрипта -->
  <script src="js/burgerMenu.js" defer></script>
  <title>Profile</title>
</head>
<body>
<div class="container">
  <header class="header">

    <div class="header-center">
      <a href="main.html"><img src="img/blogo_text.svg" alt="Logo" class="logo"></a>
      <nav class="nav">
        <a href="main.html" class="nav-link-header">Sporty</a>
        <a href="main.html" class="nav-link-header">e-Sporty</a>
      </nav>
      <div class="search-container">
        <img src="img/search.svg" alt="Szukaj" class="search-icon">
        <input type="text" placeholder="Szukaj" class="search-input">
      </div>

      <button style="background: none;" class="icon-btn notification-btn">
        <img src="img/notification-bell.svg" alt="Powiadomienia">
      </button>
      <div class="header-right" id="header_right" onclick="toggleMenu()">
        <div class="menu-container" >
          <button class="icon-btn menu-btn" style="margin-top: 0">
            <img src="img/menu-hamburger.svg" alt="Menu">
          </button>
          <div class="menu-popup" id="menuPopup">
            <div class="menu-header">
              <div class="user-info">
                <img src="img/profile.svg" alt="Avatar" class="user-avatar" id="avatarBurger">
                <div>
                  <span id="greeting">Cześć, <span id="userName">User</span></span>
                  <span id="userEmail" class="email">email@example.com</span>
                </div>
              </div>
            </div>
            <div class="menu-settings">
              <div class="setting-item">
                <span>Język</span>
                <span class="value">Polski</span>
              </div>
              <div class="setting-item">
                <span>Ciemny tryb</span>
                <input type="checkbox" id="darkThemeToggle">
              </div>
            </div>
            <div class="menu-links">
              <a href="public-profile.html" class="menu-link">Profil publiczny</a>
              <a href="profile-settings.html" class="menu-link">Ustawienie</a>
              <a href="#" class="menu-link" id="logOut" onclick="logOut()">Log Out</a>
            </div>
          </div>
        </div >
        <button class="icon-btn profile-btn"onclick="toggleMenu()">
          <img src="img/profile.svg" alt="Profil" >
        </button>
      </div>

    </div>
  </header>


  <main class="main">
    <div class="side-bar-left">
      <nav class="nav">
        <a href="profile-settings.html" class="nav-link">
          <img  src="img/profile.svg" alt="Profil" class="nav-icon"> Profil
        </a>
        <a href="private-settings.html" class="nav-link">
          <img src="img/lock-circle.svg" alt="Bezpieczeństwo" class="nav-icon"> Bezpieczeństwo
        </a>
        <a href="alerts-settings.html" class="nav-link">
          <img src="img/notification-bell.svg" alt="Powiadomienia" class="nav-icon"> Powiadomienia
        </a>
        <a href="#" class="nav-link active">
          <img src="img/key.svg" alt="Uprawnienia" class="nav-icon"> Uprawnienia
        </a>
      </nav>

    </div>
    <div class="side-bar-right">
      <h2>Uprawnienia</h2>
      <div class="group">
        <h3 class="item">Grupa</h3>
        <div class="group-card">
          <p class="group-name" id="user_group">Zweryfikowany dostęp</p>
        </div>
      </div>
      <div class="group_roles">
        <h3 class="item">Role grupy</h3>
        <div id="roles_list" class="roles-container">
          <!-- Сюда добавляются роли -->
        </div>
      </div>


    </div>







  </main>




  <footer>
    <div class="footer-content">
      <span>Wspierane przez <a href="https://zut.edu.pl" target="_blank">ZUT</a></span>
      <span>Wersja: <a href="#">1.22.1</a></span>
      <span>Strona: 2ms</span>
      <span>Szablon: 0ms</span>
    </div>
    <div class="footer-links">
      <a href="#">Licencje</a>
      <a href="#">API</a>
    </div>
  </footer>
</div>

<link rel="stylesheet" href="css/burgerMenu.css">
</body>
</html>
