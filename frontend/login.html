<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <script src="js/login.js" defer></script>

  <title>Logowanie</title>
</head>
<body>
<div class="container">
  <div class="nav-links">
    <a href="#" class="link active">Logowanie</a>
    <p>|</p>
    <a href="register.html" class="link">Rejestracja</a>
  </div>
  <form action="#">
    <div style="position: relative;">
      <div class="link-row" style="position: relative;text-align: left">
        <p class="login-p">Adres e-mail lub nazwa użytkownika</p>
      </div>
      <div style="position: relative; display: flex; align-items: center;">
        <input maxlength="64" style="display: flex" type="email" id="emailOrUsername" placeholder="Adres e-mail lub nazwa użytkownika" required>
      </div>
    </div>
    <div style="position: relative;">
      <div class="link-row" style="display: flex;text-align: right;margin: 1px">
        <p class="login-p">Hasło</p><a href="forgot-password.html">Nie pamiętasz hasła?</a>
      </div>
      <div style="position: relative; display: flex; align-items: center;">
        <input maxlength="32" type="password" id="password" placeholder="Hasło" required>
        <img src="img/eye-close.svg" alt="Pokaż/Ukryj" class="password-toggle" onclick="togglePassword('password', this)">
      </div>
    </div>
    <div class="exclude" style="margin: -2px; display: inline-flex; align-items: center;">
      <input type="checkbox" id="remember-me">
      <label for="remember-me" style="margin-top: 14px; font-size: 12px; margin-left: 5px;">Zapamiętaj mnie</label>
    </div>
    <button id="loginBtn" style=" opacity: 0.5; cursor: not-allowed;" type="submit" disabled>Zaloguj się</button>
  </form>
  <div class="social-buttons">
    <div class="social-buttons">
      <div class="line-text">
        <p> Poprzez </p>
      </div>
      <button class="social-button google">
        <img src="img/google-logo.svg" alt="Google"> Kontynuuj z Google
      </button>
      <button class="social-button apple">
        <img src="img/apple-logo.svg" alt="Apple" style="width: 5%"> Kontynuuj z Apple
      </button>
    </div>
  </div>
  <div class="link-row" style="text-align: center;display: flex">
    <p style="text-align: center;">
      Nie masz jeszcze konta? <a href="register.html" style="text-decoration: none; color: #007bff;">Załóż konto</a>
    </p>
  </div>
</div>
<footer>
  <div class="footer-content">
    <span>Wspierane przez <a href="https://zut.edu.pl" target="_blank">ZUT</a></span>
    <span>Wersja: <a href="#">1.22.1</a></span>
    <span>Strona: 2ms</span>
    <span>Szablon: 0ms</span>
  </div>
  <div class="footer-links">
    <a href="#">Licencje</a>
    <a href="#">API</a>
  </div>
</footer>
<script src="js/loginMethod.js"></script>
</body>
</html>
