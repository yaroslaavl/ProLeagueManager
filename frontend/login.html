<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <script src="js/login.js" defer></script>

  <title>Logowanie</title>
</head>
<body>

<div class="container">
  <a href="main.html"><div style="justify-content: center;display:flex">
    <img src="img/blogo_text.svg" alt="" style="width: 40%;height: 40%;">
  </div></a>
  <div class="nav-links">
    <a href="#" class="link active">Logowanie</a>
    <p>|</p>
    <a href="register.html" class="link">Rejestracja</a>
  </div>
  <form action="#">
    <div style="position: relative;">
      <div class="link-row" style="position: relative;text-align: left">
        <p class="login-p">Adres e-mail lub nazwa użytkownika</p>
      </div>
      <div style="position: relative; display: flex; align-items: center;">
        <input maxlength="64" style="display: flex" type="email" id="emailOrUsername" placeholder="Adres e-mail lub nazwa użytkownika" required>
      </div>
    </div>
    <div style="position: relative;">
      <div class="link-row" style="display: flex;margin-top:-14px;flex-direction: row;column-gap: 250px">
        <p class="login-p">Hasło</p><a href="forgot-password.html" style="justify-content: right">Nie pamiętasz hasła?</a>
      </div>
      <div style="position: relative; display: flex; align-items: center;">
        <input maxlength="32" type="password" id="password" placeholder="Hasło" required>
        <img src="img/eye-close.svg" alt="Pokaż/Ukryj" class="password-toggle" onclick="togglePassword('password', this)" style="margin-top: -1px">
      </div>
    </div>
    <div class="exclude" style="margin: -2px; display: inline-flex; align-items: center;">
      <input type="checkbox" id="remember-me">
      <label for="remember-me" style=" margin-top: 4px;font-size: 10px; margin-left: 5px;color: #58667E;;text-align: center";>Zapamiętaj mnie</label>
    </div>
    <button id="loginBtn" style="" type="submit" >Zaloguj się</button>
  </form>
  <div class="social-buttons">
    <div class="social-buttons">
      <div class="line-text">
        <p style="color: #58667E"> Poprzez </p>
      </div>
      <button class="social-button google">
        <img src="img/google-logo.svg" alt="Google" style="width: 7%;height: 7%"> Kontynuuj z Google
      </button>
      <button class="social-button apple">
        <img src="img/apple-logo.svg" alt="Apple" style="width: 5.7%;height:5.7%"> Kontynuuj z Apple
      </button>
    </div>
  </div>
  <div class="link-row" style="text-align: center;display: flex;justify-content: center">
    <p style="color: #58667E;">
      Nie masz jeszcze konta? <a href="register.html" style="color: #3861FB;">Zarejestruj się</a>
    </p>
  </div>
</div>
<footer>
  <div class="footer-content">
    <span>Wspierane przez: <a href="https://zut.edu.pl" target="_blank">ZUT</a></span>
    <span>Wersja: <a href="#">1.0.0</a></span>
    <span>Strona: 2ms</span>
    <span>Szablon: 0ms</span>
  </div>
  <div class="footer-links">
    <a href="#">Licencje</a>
    <a href="#">API</a>
  </div>
</footer>
<script src="js/loginMethod.js"></script>
</body>
</html>
