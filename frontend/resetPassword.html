<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    .form-container {
      margin-top: 50px;
      display: none; /* Скрыта до проверки токена */
    }

    input {
      display: block;
      margin: 10px auto;
      padding: 10px;
      font-size: 16px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }

    .error-message {
      color: red;
      margin-top: 20px;
    }
  </style>
</head>
<body>
<h1>Reset Your Password</h1>
<p id="status-message">Validating token...</p>

<!-- Форма для ввода нового пароля -->
<div class="form-container" id="form-container">
  <form id="reset-password-form">
    <input type="password" id="new-password" placeholder="Enter new password" required>
    <input type="password" id="confirm-password" placeholder="Confirm new password" required>
    <button type="submit">Reset Password</button>
  </form>
</div>

<!-- Сообщение об ошибке -->
<div class="error-message" id="error-message"></div>

<script src="reset-password.js"></script>
</body>
<script>
  // Извлечение токена из URL
  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('token');

  // Элементы для взаимодействия с пользователем
  const statusMessage = document.getElementById('status-message');
  const formContainer = document.getElementById('form-container');
  const errorMessage = document.getElementById('error-message');

  // Показываем форму, если токен валиден
  statusMessage.innerText = "Token is valid. Please enter your new password.";
  formContainer.style.display = 'block';

  // Обработка отправки формы
  const form = document.getElementById('reset-password-form');
  form.addEventListener('submit', async (event) => {
    event.preventDefault();

    const newPassword = document.getElementById('new-password').value;
    const confirmPassword = document.getElementById('confirm-password').value;

    // Проверка совпадения паролей
    if (newPassword !== confirmPassword) {
      errorMessage.innerText = "Passwords do not match.";
      return;
    }

    // Отправка данных на сервер
    try {
      const response = await fetch(`http://localhost:8765/user/reset-password/${token}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, newPassword })
      });

      if (response.ok) {
        alert('Password reset successful! Redirecting to login...');
        window.location.href = 'login.html'; // Перенаправление на страницу входа
      } else {
        const errorData = await response.json();
        errorMessage.innerText = errorData.message || "Failed to reset password. Please try again.";
      }
    } catch (error) {
      console.error('Error:', error);
      errorMessage.innerText = "An error occurred. Please try again later.";
    }
  });

</script>
</html>
