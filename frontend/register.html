<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">


  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" defer></script> <!-- Подключение скрипта -->
  <title>Rejestracja</title>
</head>
<body>
  <div class="container">
    <div class="nav-links">
      <a href="login.html" class="link" id="login">Logowanie</a>
      <p>|</p>
      <a href="#" class="link active" id="register">Rejestracja</a>
    </div>
  <form action="#">
    <p class="register-p">Nazwa użytkownika</p>
    <input type="text" id="username" maxlength="32" placeholder="Nazwa użytkownika" required>
    <p class="register-p">Adres e-mail</p>
    <input type="email" id="email" maxlength="64" placeholder="Adres e-mail" required>
    <div style="display: flex;gap: 175px">
      <p class="register-p">Imię</p>
      <p class="register-p">Nazwisko</p>
    </div>
    <div class="form-row">
      <input  type="text" id="firstName" maxlength="32" placeholder="Imię" required>
      <input type="text" id="lastName" maxlength="32" placeholder="Nazwisko" required>
    </div>
      <p class="register-p">Data urodzenia</p>
    <div class="form-row">
      <input id="dayInput" type="number" min="1" max="31" placeholder="Dzień" required>
      <input id="monthInput" type="number" min="1" max="12" placeholder="Miesiąc" required>
      <input id="yearInput" type="number" min="1900" max="2100" placeholder="Rok" required>
    </div>
      <p class="register-p">Hasło</p>
    <div style="position: relative;">
      <input type="password" maxlength="32" id="password1" placeholder="Hasło" required>
      <img src="img/eye-close.svg" alt="Pokaż hasło" class="password-toggle" onclick="togglePassword('password1', this)">
      <div class="error-message" id="password1-error"></div>
    </div>
    <p class="register-p">Powtórz hasło</p>
    <div style="position: relative;">
      <input type="password" maxlength="32" id="password2" placeholder="Powtórz hasło" required>
      <img src="img/eye-close.svg" alt="Pokaż hasło" class="password-toggle" onclick="togglePassword('password2', this)">
      <div class="error-message" id="password2-error"></div>
    </div>



    <button type="submit" id="register-btn" disabled style="opacity: 0.5; cursor: not-allowed;">Zarejestruj się</button>
  </form>
  <div class="social-buttons">
    <div class="line-text">
      <p> Poprzez </p>
    </div>


    <button id="googleAuth" class="social-button google">
      <img src="img/google-logo.svg" alt="Google"> Kontynuuj z Google
    </button>
    <button class="social-button apple">
      <img src="img/apple-logo.svg" alt="Apple" style="width: 5%" > Kontynuuj z Apple
    </button>
  </div>
  <div class="link-row">
    <p>Masz konto? <a href="login.html">Zaloguj się</a></p>
  </div>
</div>

  <footer>
    <div class="footer-content">
      <span>Wspierane przez <a href="https://zut.edu.pl" target="_blank">ZUT</a></span>
      <span>Wersja: <a href="#">1.22.1</a></span>
      <span>Strona: 2ms</span>
      <span>Szablon: 0ms</span>
    </div>
    <div class="footer-links">
      <a href="#">Licencje</a>
      <a href="#">API</a>
    </div>
  </footer>

<script src = "js/registerMethod.js"></script>
</body>
</html>
