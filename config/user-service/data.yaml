server:
  port: 8080

spring:
  data:
    redis:
      host: redis
      port: 6379
  flyway:
    enabled: true
    create-schemas: true  
    baseline-on-migrate: true  
    default-schema: user_data
    locations: classpath:db/migration
  datasource:
    url: jdbc:postgresql://data-base:5432/league
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
      database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    properties:
      hibernate:
        default_schema: user_data 
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: your-id
            client-secret: your-secret
           
logging:
  level:
    org.hibernate.SQL: DEBUG  
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE 
    org.springframework.jdbc.core: DEBUG  
    org.springframework.transaction: DEBUG  
    
token:
  signing:
    key: X16FXf2ORqbOmJ4ud290vJnM/D+mXnGyQ7BKL2P3GqA=
    
minio:
  url: http://minio:9000
  accessKey: admin
  secretKey: password
  bucket-name: user-image-bucket
  secure: false
