server:
  port: 8085

spring:
  flyway:
    enabled: true
    create-schemas: true  
    baseline-on-migrate: true  
    default-schema: match
    locations: classpath:db/migration
  redis:
    host: redis
    port: 6379
  datasource:
    url: jdbc:postgresql://data-base:5432/league
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
      database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    properties:
      hibernate:
        default_schema: match 
  rabbitmq:
    host: rabbitmq-server
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: false  

rabbitmq:
  exchange: competition.exchange
  
  queues:
    tournament-start:
      name: tournament.start.queue
    league-start:
      name: league.start.queue

token:
  signing:
    key: X16FXf2ORqbOmJ4ud290vJnM/D+mXnGyQ7BKL2P3GqA=

resilience4j:
  retry:
    configs:
      default:
        max-attempts: 3    
        wait-duration: 2s 
        retry-exceptions:   
          - org.springframework.web.client.HttpServerErrorException
          - feign.FeignException
          - feign.RetryableException
          - java.net.SocketTimeoutException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException$BadRequest
          - org.springframework.web.client.HttpClientErrorException$NotFound
          - org.springframework.web.bind.MethodArgumentNotValidException
        event-consumer-buffer-size: 10
    instances:
      notificationServiceRetry:
        base-config: default
      sportServiceRetry:
        base-config: default
      competitionServiceRetry:
        base-config: default
      teamServiceRetry:
        base-config: default
