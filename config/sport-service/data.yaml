server:
  port: 8083
  
spring:
  data:
    redis:
      host: redis
      port: 6379
  flyway:
    enabled: true
    create-schemas: true  
    baseline-on-migrate: true  
    default-schema: sport
    locations: classpath:db/migration
  datasource:
    url: jdbc:postgresql://data-base:5432/league
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
      database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    properties:
      hibernate:
        default_schema: sport 
token:
