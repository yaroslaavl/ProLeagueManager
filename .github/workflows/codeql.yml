name: "CodeQL – Backend Scan"

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    paths:
      - "backend/**"          # реагируем только на изменения в backend
  pull_request:
    branches: [ "master" ]
    paths:
      - "backend/**"
  schedule:
    - cron: '0 3 * * 1'       # еженедельно по понедельникам в 03:00 UTC

jobs:
  analyze-backend:
    name: Analyze backend
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      packages: read

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Initialize CodeQL for Java
      uses: github/codeql-action/init@v3
      with:
        languages: java-kotlin
        build-mode: manual

    - name: Build backend module
      # собираем только папку backend, пропуская тесты для скорости
      run: mvn -f backend/pom.xml clean install -DskipTests

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:java"
