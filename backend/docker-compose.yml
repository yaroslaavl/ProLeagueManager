name: ProLeagueManager
services:
  consul:
    image: hashicorp/consul
    container_name: consul
    environment:
      - CONSUL_BIND_INTERFACE=eth0
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    volumes:
      - consul_data:/consul/data
    command: agent -server -data-dir=/consul/data -bootstrap-expect=1 -ui -client 0.0.0.0
    restart: always
    depends_on:
      - redis
    networks:
      - ProLeagueManager

  redis:
    image: redis:latest
    container_name: redis
    environment:
      ALLOW_EMPTY_PASSWORD: yes
      REDIS_DISABLE_COMMANDS: FLUSHDB,FLUSHALL
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: always
    networks:
      - ProLeagueManager

  minio:
    image: quay.io/minio/minio
    container_name: minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9090:9090"
    command: server /data --console-address ":9090"
    restart: always
    networks:
      - ProLeagueManager

  rabbitmq:
    image: rabbitmq:4.0-management
    container_name: rabbitmq-server
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "15672:15672"
      - "5672:5672"
    networks:
      - ProLeagueManager

  data-base:
    image: postgres:16.1
    container_name: data-base
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: league
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    command: ["postgres", "-c", "max_connections=200"]
    networks:
      - ProLeagueManager

  gateway:
    build:
      context: .
      dockerfile: gateway/gateway.Dockerfile
    container_name: gateway
    ports:
      - "8765:8765"
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
    depends_on:
      - consul
      - rabbitmq
      - minio
      - data-base
    networks:
      - ProLeagueManager

  user-service-instance1:
    build:
      context: .
      dockerfile: user-service/user-service.Dockerfile
    container_name: user-service-instance1
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      SPRING_CLOUD_CONSUL_DISCOVERY_INSTANCE_ID: user-service-instance1
    depends_on:
      - gateway
    networks:
      - ProLeagueManager

  user-service-instance2:
    build:
      context: .
      dockerfile: user-service/user-service.Dockerfile
    container_name: user-service-instance2
    ports:
      - "7080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      SPRING_CLOUD_CONSUL_DISCOVERY_INSTANCE_ID: user-service-instance2
    depends_on:
      - gateway
    networks:
      - ProLeagueManager

  team-management-service-instance1:
    build:
      context: .
      dockerfile: team-management-service/team-management-service.Dockerfile
    container_name: team-management-service-instance1
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      SPRING_CLOUD_CONSUL_DISCOVERY_INSTANCE_ID: team-management-service-instance1
    depends_on:
      - user-service-instance2
    networks:
      - ProLeagueManager

  team-management-service-instance2:
    build:
      context: .
      dockerfile: team-management-service/team-management-service.Dockerfile
    container_name: team-management-service-instance2
    ports:
      - "7082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      SPRING_CLOUD_CONSUL_DISCOVERY_INSTANCE_ID: team-management-service-instance2
    depends_on:
      - team-management-service-instance1
    networks:
      - ProLeagueManager

  sport-service-instance1:
    build:
      context: .
      dockerfile: sport-service/sport-service.Dockerfile
    container_name: sport-service-instance1
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      SPRING_CLOUD_CONSUL_DISCOVERY_INSTANCE_ID: sport-service-instance1
    depends_on:
      - team-management-service-instance2
    networks:
      - ProLeagueManager

  sport-service-instance2:
    build:
      context: .
      dockerfile: sport-service/sport-service.Dockerfile
    container_name: sport-service-instance2
    ports:
      - "7083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      SPRING_CLOUD_CONSUL_DISCOVERY_INSTANCE_ID: sport-service-instance2
    depends_on:
      - sport-service-instance1
    networks:
      - ProLeagueManager

  notification-service-instance1:
    build:
      context: .
      dockerfile: notification-service/notification-service.Dockerfile
    container_name: notification-service-instance1
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_DISCOVERY_INSTANCE_ID: notification-service-instance1
    depends_on:
      - sport-service-instance2
    networks:
      - ProLeagueManager

  notification-service-instance2:
    build:
      context: .
      dockerfile: notification-service/notification-service.Dockerfile
    container_name: notification-service-instance2
    ports:
      - "7081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      SPRING_CLOUD_CONSUL_DISCOVERY_INSTANCE_ID: notification-service-instance2
    depends_on:
      - notification-service-instance1
    networks:
      - ProLeagueManager

  competition-management-service-instance1:
    build:
      context: .
      dockerfile: competition-management-service/competition-management-service.Dockerfile
    container_name: competition-management-service-instance1
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      SPRING_CLOUD_CONSUL_DISCOVERY_INSTANCE_ID: competition-management-service-instance1
    depends_on:
      - notification-service-instance2
    networks:
      - ProLeagueManager

  competition-management-service-instance2:
    build:
      context: .
      dockerfile: competition-management-service/competition-management-service.Dockerfile
    container_name: competition-management-service-instance2
    ports:
      - "7084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      SPRING_CLOUD_CONSUL_DISCOVERY_INSTANCE_ID: competition-management-service-instance2
    depends_on:
      - competition-management-service-instance1
    networks:
      - ProLeagueManager

  feedback-service-instance1:
    build:
      context: .
      dockerfile: feedback-service/feedback-service.Dockerfile
    container_name: feedback-service-instance1
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      SPRING_CLOUD_CONSUL_DISCOVERY_INSTANCE_ID: feedback-service-instance1
    depends_on:
      - competition-management-service-instance2
    networks:
      - ProLeagueManager

  feedback-service-instance2:
    build:
      context: .
      dockerfile: feedback-service/feedback-service.Dockerfile
    container_name: feedback-service-instance2
    ports:
      - "7086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      SPRING_CLOUD_CONSUL_DISCOVERY_INSTANCE_ID: feedback-service-instance2
    depends_on:
      - feedback-service-instance1
    networks:
      - ProLeagueManager

  match-service-instance1:
    build:
      context: .
      dockerfile: match-service/match-service.Dockerfile
    container_name: match-service-instance1
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      SPRING_CLOUD_CONSUL_DISCOVERY_INSTANCE_ID: match-service-instance1
    depends_on:
      - feedback-service-instance2
    networks:
      - ProLeagueManager

  match-service-instance2:
    build:
      context: .
      dockerfile: match-service/match-service.Dockerfile
    container_name: match-service-instance2
    ports:
      - "7085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      SPRING_CLOUD_CONSUL_DISCOVERY_INSTANCE_ID: match-service-instance2
    depends_on:
      - match-service-instance1
    networks:
      - ProLeagueManager

  calendar-event-service-instance1:
    build:
      context: .
      dockerfile: calendar-event-service/calendar-event-service.Dockerfile
    container_name: calendar-event-service-instance1
    ports:
      - "8087:8087"
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      SPRING_CLOUD_CONSUL_DISCOVERY_INSTANCE_ID: calendar-event-service-instance1
    depends_on:
      - match-service-instance2
    networks:
      - ProLeagueManager

  calendar-event-service-instance2:
    build:
      context: .
      dockerfile: calendar-event-service/calendar-event-service.Dockerfile
    container_name: calendar-event-service-instance2
    ports:
      - "7087:8087"
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      SPRING_CLOUD_CONSUL_DISCOVERY_INSTANCE_ID: calendar-event-service-instance2
    depends_on:
      - calendar-event-service-instance1
    networks:
      - ProLeagueManager

  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: victoriametrics
    ports:
      - "8428:8428"
    volumes:
      - victoriametrics_data:/victoriametrics-data
      - ./promscrape.yml:/etc/promscrape.yml:ro
    command: -promscrape.config=/etc/promscrape.yml -storageDataPath=/victoriametrics-data
    restart: always
    networks:
      - ProLeagueManager

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=proleague
    volumes:
      - grafana_data:/var/lib/grafana
    restart: always
    depends_on:
      - victoriametrics
    networks:
      - ProLeagueManager

networks:
  ProLeagueManager:
    driver: bridge

volumes:
  redis_data:
    driver: local

  minio_data:

  consul_data:
    driver: local

  postgres-data:

  victoriametrics_data:

  grafana_data: