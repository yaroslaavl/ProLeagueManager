<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSE Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            position: relative;
        }
        ul {
            list-style: none;
            padding: 0;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
        }
        li {
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #4CAF50;
            border-radius: 5px;
            background-color: #f9f9f9;
            color: #333;
        }
        .error {
            color: red;
        }
        /* ✅ Стили для всплывающих уведомлений */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #4CAF50;
            color: white;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            opacity: 1;
            transition: opacity 0.5s ease-in-out;
        }
    </style>
</head>
<body>
<h1>SSE Test</h1>
<p>Notifications:</p>
<ul id="notifications"></ul>
<p id="status" class="error"></p>

<script>
    console.log("Hello")

    const eventSource = new EventSource("http://localhost:8765/my-notifications/subscribe/1");

    eventSource.onopen = () => {
        console.log("SSE connection opened.");
        updateStatus("Connected to the server.", false);
    };

    eventSource.onmessage = (event) => {
        console.log("Notification received: ", event.data);
        displayNotification(event.data);
        showToast(event.data);  // ✅ Показываем всплывающее уведомление
    };

    eventSource.onerror = () => {
        console.error("Error with SSE connection.");
        updateStatus("Connection lost. Retrying...", true);
    };

    function displayNotification(message) {
        const notificationElement = document.createElement("li");
        notificationElement.innerText = message;

        const notificationsList = document.getElementById("notifications");
        notificationsList.appendChild(notificationElement);

        if (notificationsList.children.length > 20) {
            notificationsList.removeChild(notificationsList.firstChild);
        }
    }

    function updateStatus(message, isError) {
        const statusElement = document.getElementById("status");
        statusElement.innerText = message;
        statusElement.style.color = isError ? "red" : "green";
    }

    // ✅ Функция показа всплывающего уведомления
    function showToast(message) {
        const toast = document.createElement("div");
        toast.classList.add("toast");
        toast.innerText = message;
        document.body.appendChild(toast);

        setTimeout(() => {
            toast.style.opacity = "0";
            setTimeout(() => toast.remove(), 500);
        }, 5000); // Через 5 секунд удаляем уведомление
    }
</script>
</body>
</html>
